[project]
name = WiSense-MCP

[paths]
dataset_dir = data/raw/WiMANS
split_dir = data/processed/splits
normalization_file = data/processed/normalization/training_channel_stats.npz
cache_dir = data/processed/tensor_cache
best_values_file = artifacts/best_values.json
model_dir = models
training_results_dir = results/training
ensemble_results_dir = results/ensemble
final_results_dir = results/final

[dataset]
annotation_file = annotation.csv
amplitude_subdir = wifi_csi/amp
sample_id_column = label
environment_column = environment
band_column = wifi_band
user_count_column = number_of_users
num_users = 6
activities = jump, lie_down, nothing, pick_up, rotation, sit_down, stand_up, walk, wave
nominal_packets = 3000
duration_seconds = 3.0
num_channels = 270

[split]
random_seed = 42
train_fraction = 0.70
validation_fraction = 0.10
test_fraction = 0.20
minimum_stratum_size = 5

[preprocessing]
target_length = 3000
cache_dtype = float16
standard_deviation_epsilon = 1e-8

[model]
temporal_segments = 3
max_cnn_channels = 512
attention_hidden_min = 32

[training]
seeds = 42, 43, 44
max_epochs = 200
early_stopping_patience = 25
minimum_improvement = 0.0001
presence_threshold = 0.50
presence_loss_weight = 1.0
gradient_clip_norm = 5.0
scheduler_factor = 0.5
scheduler_patience = 8
minimum_learning_rate = 1e-6
num_workers = 8
use_amp = true
deterministic = true

[diagnostics]
activity_entropy_weight = 0.45
activity_margin_weight = 0.30
presence_uncertainty_weight = 0.25

[evaluation]
batch_size = 64
verification_samples_per_split = 3
verification_tolerance = 0.001
prevent_test_overwrite = true

[server]
host = 127.0.0.1
port = 8000
keep_alive_seconds = 120
signal_preview_points = 180
top_k_activities = 3
